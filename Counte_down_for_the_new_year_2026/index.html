<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Counter-down</title>
</head>
 
<body>

    <div class="container">
        
        <div class="wrapper">
            <h1>New year 2025 </h1>
           <div class="inside">
                <div class="wrapper-Date">
                    <p id="days">022</p>
                    <span>Days</span>
                </div>
                <div class="wrapper-Date">
                    <p id="hour">00</p>
                    <span>Hours</span>
                </div>
                
                <div class="wrapper-Date">
                    <p id="min">00</p>
                    <span>Minutes</span>
                </div>
                
                <div class="wrapper-Date">
                    <p id="sec">00</p>
                    <span>secondes</span>
                </div>
           </div>
        </div>

    </div>

    <script src="index.js"></script>
</body>

</html>
