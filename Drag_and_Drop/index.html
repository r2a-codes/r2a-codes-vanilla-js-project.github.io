<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag & Drop</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="index.js"></script>
</head>
<body>

    <div class="header">
        <h2>Drag and Drop</h2>
    </div>

    <div class="container">
        <div class="wrapper">
            <div class="draggableElement" draggable="true">1</div>
            <div class="draggableElement" draggable="true">2</div>
            <div class="draggableElement" draggable="true">3</div>
        </div>
        <div class="wrapper">
            <div class="draggableElement" draggable="true">4</div>
            <div class="draggableElement" draggable="true">5</div>
        </div>
        <div class="wrapper">
            <div class="draggableElement" draggable="true">6</div>
        </div>
    </div>

    
</body>
</html>
