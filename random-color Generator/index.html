<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Background Generator</title>
</head>

<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body{
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
    }
    .wrapper{
        background-color: black;
        width: 450px;
        height: 120px;
        text-align: center;
        border-radius: 10px;
    }

    .wrapper h1 {
        color: aliceblue;
        margin: 15px;
    }

    .wrapper h3 {
        color: rgba(240, 248, 255, 0.651);

    }

    .btn{
        border: 2px solid black;
        background-color: transparent;
        margin-top: 30px;
        padding: 5px 12px;
        font-size: 16px;
        font-weight: 700;
        border-radius: 10px;
        cursor: pointer;

    }

    
    .btn:hover{
        background-color: black;
        color: aliceblue;
    }



</style>

<body>

    <div class="wrapper">
        <h1>Background Color :</h1>
        <h3 class="color-wrapper"></h3>
    </div>

    <button class="btn">click me</button>

    <script src="script.js"></script>
</body>

</html>
