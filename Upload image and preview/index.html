<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>image uploader</title>
  </head>

  <style>
    body {
      background: rgb(4, 4, 61);
      display: flex;
      /* justify-content: center; */
      align-items: center;
      flex-direction: column;
      position: relative;
    }

    body::before {
      content: "";
      width: 100%;
      height: 10px;
      background: #6b6bfc;
      position: absolute;
      top: 15%;
    }

    h1 {
      color: #6b6bfc;
    }

    .input-field {
      width: 150px;
      height: 20px;
      margin: 20px;
      color: white;
      text-align: center;
    }

    .img-container {
      width: 300px;
      height: 400px;
      border: 3px solid #4c4cf8;
      color: #4c4cf8;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .img-container img {
      width: 100%;
      height: 100%;
      display: none;
    }
  </style>
  <body>
    <h1>Image uploader</h1>

    <div class="input-field">
      <input type="file" name="file-input" id="file_input" />
    </div>

    <div class="img-container">
      <img src="" alt="image container" id="img-preview" />

      <h3 id="place_holder">image container</h3>
    </div>

    <script>
      const inpFile = document.getElementById("file_input");
      const imgPreview = document.getElementById("img-preview");
      const placeHolder = document.getElementById("place_holder");

      inpFile.addEventListener("change", function () {
        let file = this.files[0];

        console.log(file);
        if (file) {
          const reader = new FileReader();

          placeHolder.style.display = "none";

          imgPreview.style.display = "block";

          reader.addEventListener("load", function () {
            imgPreview.setAttribute("src", this.result);
          });

          reader.readAsDataURL(file);
        } else {
          placeHolder.style.display = null;

          imgPreview.style.display = null;
        }
      });

      setTimeout(() => {
        console.log(imgPreview.src);
      }, 10000);
    </script>
  </body>
</html>
